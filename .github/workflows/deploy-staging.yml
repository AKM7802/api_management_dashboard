name: Deploy to Staging

# Manual, any branch: build the chosen branch's HEAD and ask aswinkunju/infra to roll
# it out to the apimgmt-staging stack. See aswinkunju/infra docs/CI_CD_WORKFLOW.md §3.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and deploy to staging
        required: true
        default: main

env:
  REGISTRY: ghcr.io
  OWNER: aswinkunju
  APP: api-mgmt-dashboard
  # PLACEHOLDER — replace with the real staging API domain (see
  # aswinkunju/infra apps/api-mgmt-dashboard/README.md).
  API_PUBLIC_URL: https://test.api-dashboard.example.com

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, api]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-${{ matrix.target }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.target == 'web' && 'frontend' || 'backend' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ${{ matrix.target == 'web' && format('NEXT_PUBLIC_API_URL={0}', env.API_PUBLIC_URL) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-${{ matrix.target }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP }}-${{ matrix.target }}:cache,mode=max

  dispatch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: compute tag
        id: tag
        run: |
          sha=$(git ls-remote https://github.com/${{ github.repository }} \
                  "refs/heads/${{ inputs.branch }}" | cut -c1-7)
          echo "tag=sha-${sha}" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: aswinkunju/infra
          event-type: deploy
          client-payload: >-
            {"app": "${{ env.APP }}", "env": "staging", "image_tag": "${{ steps.tag.outputs.tag }}"}
